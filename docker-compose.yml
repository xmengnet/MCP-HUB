services:
  mcp-server:
    build: .
    container_name: workday-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    command:
      - "-addr"
      - ":8080"
      - "-api-keys"
      - "${API_KEYS:-}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
