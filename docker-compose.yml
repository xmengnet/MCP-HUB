services:
  mcp-server:
    build:
      context: .
      target: runtime
    container_name: mcp-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # 挂载 Docker socket，使代码执行沙箱（code-exec）可以创建隔离容器
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "-config"
      - "/app/config.yaml"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
