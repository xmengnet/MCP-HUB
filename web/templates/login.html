<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>登录 - MCP Hub</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF9F7;
            --accent: #C05621;
            --accent-hover: #A8491C;
            --text-primary: #2D2A26;
            --text-secondary: #6B6560;
            --text-muted: #9C9590;
            --border: rgba(45, 42, 38, 0.1);
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 400px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-brand .logo-icon {
            width: 48px;
            height: 48px;
            background: var(--accent);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .login-brand h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .login-brand p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .login-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: 0 4px 24px rgba(45, 42, 38, 0.06);
        }

        .error-msg {
            background: #FEF2F2;
            color: #B91C1C;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(185, 28, 28, 0.1);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 86, 33, 0.08);
        }

        input[type="password"]::placeholder {
            color: var(--text-muted);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(192, 86, 33, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        .login-footer {
            text-align: center;
            margin-top: 20px;
        }

        .login-footer a {
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.15s;
        }

        .login-footer a:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>
    <div class="login-wrapper">
        <div class="login-brand">
            <div class="logo-icon">M</div>
            <h1>MCP Hub</h1>
            <p>请输入 API Key 以继续</p>
        </div>
        <div class="login-card">
            {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}
            <form method="POST" action="/login?redirect={{.Redirect}}">
                <div class="form-group">
                    <label for="api_key">API Key</label>
                    <input type="password" id="api_key" name="api_key" placeholder="输入您的 API Key" required autofocus>
                </div>
                <button type="submit">Sign In</button>
            </form>
        </div>
        <div class="login-footer">
            <a href="/">← 返回首页</a>
        </div>
    </div>
</body>

</html>
