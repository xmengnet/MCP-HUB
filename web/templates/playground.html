<!DOCTYPE html>
<html>

<head>
    <title>Playground - MCP 服务中心</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header a {
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
        }

        .header a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: calc(100vh - 54px);
        }

        /* 侧边栏 */
        .sidebar {
            background: white;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
        }

        .sidebar-section {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sidebar-section h2 {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .service-item {
            padding: 12px;
            margin: 4px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .service-item:hover {
            background: #f5f5f5;
        }

        .service-item.active {
            background: #667eea;
            color: white;
        }

        .service-item .desc {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }

        .tool-item {
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }

        .tool-item:hover {
            border-color: #667eea;
            background: #f8f8ff;
        }

        .tool-item.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        /* 主区域 */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tool-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .tool-header h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 5px;
        }

        .tool-header p {
            color: #666;
            font-size: 14px;
        }

        .content-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 参数面板 */
        .params-panel {
            width: 400px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .params-header {
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .params-header h3 {
            font-size: 14px;
            color: #333;
        }

        .params-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .param-group {
            margin-bottom: 15px;
        }

        .param-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .param-label .name {
            color: #333;
        }

        .param-label .type {
            color: #888;
            font-weight: normal;
            font-size: 12px;
        }

        .param-label .required {
            color: #dc2626;
            font-size: 11px;
        }

        .param-desc {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        input.param-input,
        select.param-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input.param-input:focus,
        select.param-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            margin: 15px;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* 响应区域 */
        .response-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #1e1e1e;
        }

        .response-header {
            padding: 15px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .response-header h3 {
            font-size: 14px;
            color: #888;
        }

        .response-header .status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .response-header .status.success {
            background: #065f46;
            color: #d1fae5;
        }

        .response-header .status.error {
            background: #991b1b;
            color: #fecaca;
        }

        .response-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 13px;
            color: #d4d4d4;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            text-align: center;
            padding: 40px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* 加载动画 */
        .loading {
            color: #888;
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .params-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎮 MCP Playground</h1>
        <a href="/">← 返回首页</a>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h2>📦 服务</h2>
                <div id="services"></div>
            </div>
            <div class="sidebar-section" id="tools-section" style="display:none;">
                <h2>🔧 工具</h2>
                <div id="tools"></div>
            </div>
        </div>

        <div class="main">
            <div id="tool-header" class="tool-header" style="display:none;">
                <h2 id="tool-name"></h2>
                <p id="tool-desc"></p>
            </div>

            <div class="content-area">
                <div id="params-panel" class="params-panel" style="display:none;">
                    <div class="params-header">
                        <h3>📝 参数</h3>
                    </div>
                    <div id="params-body" class="params-body"></div>
                    <button class="send-btn" id="send-btn" onclick="sendRequest()">
                        ▶ 发送请求
                    </button>
                </div>

                <div class="response-panel">
                    <div class="response-header">
                        <h3>📤 响应</h3>
                        <span id="response-status" class="status" style="display:none;"></span>
                    </div>
                    <div id="response-body" class="response-body">
                        <div class="empty-state">
                            <div class="icon">🎯</div>
                            <h3>开始调试</h3>
                            <p>1. 从左侧选择一个服务<br>
                                2. 选择要调用的工具<br>
                                3. 填写参数并发送请求</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const services = {{.ServicesJSON }};
        let currentService = null;
        let currentTool = null;
        let tools = [];

        // 渲染服务列表
        const servicesEl = document.getElementById('services');
        services.forEach((svc, i) => {
            const div = document.createElement('div');
            div.className = 'service-item';
            div.innerHTML = `<div>${svc.name}</div><div class="desc">${svc.description}</div>`;
            div.onclick = () => selectService(i);
            servicesEl.appendChild(div);
        });

        async function selectService(index) {
            currentService = services[index];
            currentTool = null;

            // 更新 UI
            document.querySelectorAll('#services .service-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.getElementById('tool-header').style.display = 'none';
            document.getElementById('params-panel').style.display = 'none';

            // 获取工具列表
            const toolsSection = document.getElementById('tools-section');
            const toolsEl = document.getElementById('tools');
            toolsSection.style.display = 'block';
            toolsEl.innerHTML = '<div style="color:#888;font-size:13px;">加载中...</div>';

            try {
                const resp = await fetch(currentService.path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list' })
                });
                const data = await resp.json();
                tools = data.result?.tools || [];

                if (tools.length === 0) {
                    toolsEl.innerHTML = '<div style="color:#888;font-size:13px;">无可用工具</div>';
                    return;
                }

                toolsEl.innerHTML = '';
                tools.forEach((tool, i) => {
                    const div = document.createElement('div');
                    div.className = 'tool-item';
                    div.textContent = tool.name;
                    div.onclick = () => selectTool(i);
                    toolsEl.appendChild(div);
                });
            } catch (e) {
                toolsEl.innerHTML = '<div style="color:#dc2626;font-size:13px;">加载失败</div>';
            }
        }

        function selectTool(index) {
            currentTool = tools[index];

            // 更新 UI
            document.querySelectorAll('#tools .tool-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // 显示工具信息
            document.getElementById('tool-header').style.display = 'block';
            document.getElementById('tool-name').textContent = currentTool.name;
            document.getElementById('tool-desc').textContent = currentTool.description || '无描述';

            // 生成参数表单
            const paramsPanel = document.getElementById('params-panel');
            const paramsBody = document.getElementById('params-body');
            paramsPanel.style.display = 'flex';

            const schema = currentTool.inputSchema;
            const properties = schema?.properties || {};
            const required = schema?.required || [];

            if (Object.keys(properties).length === 0) {
                paramsBody.innerHTML = '<div style="color:#888;font-size:13px;text-align:center;padding:20px;">此工具不需要参数</div>';
            } else {
                paramsBody.innerHTML = '';
                for (const [name, prop] of Object.entries(properties)) {
                    const isRequired = required.includes(name);
                    const group = document.createElement('div');
                    group.className = 'param-group';

                    let inputHTML = '';
                    if (prop.enum) {
                        inputHTML = `<select class="param-input" id="param-${name}" ${isRequired ? 'required' : ''}>
                            <option value="">-- 请选择 --</option>
                            ${prop.enum.map(v => `<option value="${v}">${v}</option>`).join('')}
                        </select>`;
                    } else if (prop.type === 'boolean') {
                        inputHTML = `<select class="param-input" id="param-${name}">
                            <option value="">-- 请选择 --</option>
                            <option value="true">true</option>
                            <option value="false">false</option>
                        </select>`;
                    } else if (prop.type === 'integer' || prop.type === 'number') {
                        inputHTML = `<input class="param-input" type="number" id="param-${name}" placeholder="请输入${prop.type === 'integer' ? '整数' : '数字'}" ${isRequired ? 'required' : ''}>`;
                    } else {
                        inputHTML = `<input class="param-input" type="text" id="param-${name}" placeholder="${prop.default ? '默认: ' + prop.default : '请输入'}" ${isRequired ? 'required' : ''}>`;
                    }

                    group.innerHTML = `
                        <div class="param-label">
                            <span class="name">${name}</span>
                            <span class="type">${prop.type || 'string'}${prop.enum ? ' (枚举)' : ''}</span>
                            ${isRequired ? '<span class="required">*必填</span>' : ''}
                        </div>
                        ${prop.description ? `<div class="param-desc">${prop.description}</div>` : ''}
                        ${inputHTML}
                    `;
                    paramsBody.appendChild(group);
                }
            }
        }

        async function sendRequest() {
            if (!currentService || !currentTool) {
                alert('请先选择服务和工具');
                return;
            }

            // 收集参数
            const schema = currentTool.inputSchema;
            const properties = schema?.properties || {};
            const params = {};

            for (const name of Object.keys(properties)) {
                const el = document.getElementById(`param-${name}`);
                if (el && el.value !== '') {
                    const prop = properties[name];
                    if (prop.type === 'integer') {
                        params[name] = parseInt(el.value, 10);
                    } else if (prop.type === 'number') {
                        params[name] = parseFloat(el.value);
                    } else if (prop.type === 'boolean') {
                        params[name] = el.value === 'true';
                    } else {
                        params[name] = el.value;
                    }
                }
            }

            const responseBody = document.getElementById('response-body');
            const responseStatus = document.getElementById('response-status');
            const sendBtn = document.getElementById('send-btn');

            sendBtn.disabled = true;
            sendBtn.textContent = '请求中...';
            responseBody.innerHTML = '<span class="loading">正在请求</span>';
            responseStatus.style.display = 'none';

            try {
                const resp = await fetch(currentService.path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'tools/call',
                        params: { name: currentTool.name, arguments: params }
                    })
                });
                const data = await resp.json();

                responseStatus.style.display = 'inline-block';

                if (data.error) {
                    responseStatus.className = 'status error';
                    responseStatus.textContent = '错误';
                    responseBody.textContent = JSON.stringify(data.error, null, 2);
                } else {
                    responseStatus.className = 'status success';
                    responseStatus.textContent = '成功';

                    if (data.result?.content?.[0]?.text) {
                        responseBody.textContent = data.result.content[0].text;
                    } else {
                        responseBody.textContent = JSON.stringify(data.result, null, 2);
                    }
                }
            } catch (e) {
                responseStatus.style.display = 'inline-block';
                responseStatus.className = 'status error';
                responseStatus.textContent = '错误';
                responseBody.textContent = '请求失败: ' + e.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '▶ 发送请求';
            }
        }
    </script>
</body>

</html>
