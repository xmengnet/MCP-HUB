<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>Playground - MCP Hub</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAF9F7;
            --bg-sidebar: #F5F3F0;
            --bg-card: #FFFFFF;
            --accent: #C05621;
            --accent-hover: #A8491C;
            --accent-light: rgba(192, 86, 33, 0.06);
            --text-primary: #2D2A26;
            --text-secondary: #6B6560;
            --text-muted: #9C9590;
            --border: rgba(45, 42, 38, 0.08);
            --border-strong: rgba(45, 42, 38, 0.12);
            --radius: 14px;
            --radius-sm: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .logo-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 12px;
        }

        .header h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .header h1 .badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent);
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            margin-left: 8px;
            letter-spacing: 0;
        }

        .header-right a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: all 0.15s;
        }

        .header-right a:hover {
            border-color: var(--border-strong);
            color: var(--text-primary);
        }

        /* ---- Layout ---- */
        .container {
            display: grid;
            grid-template-columns: 260px 1fr;
            flex: 1;
            overflow: hidden;
        }

        /* ---- Sidebar ---- */
        .sidebar {
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 16px;
        }

        .sidebar-section+.sidebar-section {
            border-top: 1px solid var(--border);
        }

        .sidebar-section h2 {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            padding: 0 8px;
        }

        .service-item {
            padding: 10px 12px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .service-item:hover {
            background: rgba(45, 42, 38, 0.04);
            color: var(--text-primary);
        }

        .service-item.active {
            background: var(--accent);
            color: white;
        }

        .service-item .desc {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 3px;
            line-height: 1.4;
        }

        .tool-item {
            padding: 8px 12px;
            margin: 3px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border);
            background: var(--bg-card);
            transition: all 0.15s;
        }

        .tool-item:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(192, 86, 33, 0.02);
        }

        .tool-item.active {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
        }

        /* ---- Main Area ---- */
        .main {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .tool-header {
            background: var(--bg-card);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }

        .tool-header h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .tool-header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .content-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ---- Params Panel ---- */
        .params-panel {
            width: 380px;
            flex-shrink: 0;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .params-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .params-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .params-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .param-group {
            margin-bottom: 16px;
        }

        .param-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .param-label .name {
            color: var(--text-primary);
        }

        .param-label .type {
            color: var(--text-muted);
            font-weight: 400;
            font-size: 11px;
            background: var(--bg-primary);
            padding: 1px 6px;
            border-radius: 4px;
        }

        .param-label .required {
            color: #DC2626;
            font-size: 11px;
            font-weight: 600;
        }

        .param-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            line-height: 1.4;
        }

        input.param-input,
        select.param-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-primary);
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }

        input.param-input:focus,
        select.param-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 86, 33, 0.08);
        }

        .send-btn {
            margin: 16px 20px;
            padding: 11px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
        }

        .send-btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(192, 86, 33, 0.2);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* ---- Response Panel ---- */
        .response-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #1A1917;
        }

        .response-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .response-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: #7A756F;
        }

        .response-header .status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 6px;
        }

        .response-header .status.success {
            background: rgba(34, 197, 94, 0.15);
            color: #4ADE80;
        }

        .response-header .status.error {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
        }

        .response-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
            font-family: 'SF Mono', Monaco, Menlo, Consolas, monospace;
            font-size: 13px;
            color: #D4D0CC;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.7;
        }

        /* ---- Empty State ---- */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            padding: 40px;
        }

        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.7;
            color: var(--text-muted);
        }

        .empty-state ol {
            text-align: left;
            font-size: 13px;
            line-height: 2;
            color: var(--text-muted);
            padding-left: 20px;
        }

        /* ---- Loading ---- */
        .loading {
            color: var(--text-muted);
        }

        .loading::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '.';
            }

            40% {
                content: '..';
            }

            60%,
            100% {
                content: '...';
            }
        }

        /* ---- Responsive ---- */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }

            .params-panel {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">M</div>
            <h1>MCP Hub <span class="badge">Playground</span></h1>
        </div>
        <div class="header-right">
            <a href="/">← 返回首页</a>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="sidebar-section">
                <h2>服务</h2>
                <div id="services"></div>
            </div>
            <div class="sidebar-section" id="tools-section" style="display:none;">
                <h2>工具</h2>
                <div id="tools"></div>
            </div>
        </div>

        <div class="main">
            <div id="tool-header" class="tool-header" style="display:none;">
                <h2 id="tool-name"></h2>
                <p id="tool-desc"></p>
            </div>

            <div class="content-area">
                <div id="params-panel" class="params-panel" style="display:none;">
                    <div class="params-header">
                        <h3>参数</h3>
                    </div>
                    <div id="params-body" class="params-body"></div>
                    <button class="send-btn" id="send-btn" onclick="sendRequest()">
                        ▶ 发送请求
                    </button>
                </div>

                <div class="response-panel">
                    <div class="response-header">
                        <h3>响应</h3>
                        <span id="response-status" class="status" style="display:none;"></span>
                    </div>
                    <div id="response-body" class="response-body">
                        <div class="empty-state">
                            <div class="icon">⚡</div>
                            <h3>开始调试</h3>
                            <ol>
                                <li>从左侧选择一个服务</li>
                                <li>选择要调用的工具</li>
                                <li>填写参数并发送请求</li>
                            </ol>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const services = {{.ServicesJSON }};
        let currentService = null;
        let currentTool = null;
        let tools = [];

        // 渲染服务列表
        const servicesEl = document.getElementById('services');
        services.forEach((svc, i) => {
            const div = document.createElement('div');
            div.className = 'service-item';
            div.innerHTML = `<div>${svc.name}</div><div class="desc">${svc.description}</div>`;
            div.onclick = () => selectService(i);
            servicesEl.appendChild(div);
        });

        async function selectService(index) {
            currentService = services[index];
            currentTool = null;

            // 更新 UI
            document.querySelectorAll('#services .service-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
            document.getElementById('tool-header').style.display = 'none';
            document.getElementById('params-panel').style.display = 'none';

            // 获取工具列表
            const toolsSection = document.getElementById('tools-section');
            const toolsEl = document.getElementById('tools');
            toolsSection.style.display = 'block';
            toolsEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px;">加载中...</div>';

            try {
                const resp = await fetch(currentService.path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ jsonrpc: '2.0', id: 1, method: 'tools/list' })
                });
                const data = await resp.json();
                tools = data.result?.tools || [];

                if (tools.length === 0) {
                    toolsEl.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:8px;">无可用工具</div>';
                    return;
                }

                toolsEl.innerHTML = '';
                tools.forEach((tool, i) => {
                    const div = document.createElement('div');
                    div.className = 'tool-item';
                    div.textContent = tool.name;
                    div.onclick = () => selectTool(i);
                    toolsEl.appendChild(div);
                });
            } catch (e) {
                toolsEl.innerHTML = '<div style="color:#DC2626;font-size:13px;padding:8px;">加载失败</div>';
            }
        }

        function selectTool(index) {
            currentTool = tools[index];

            // 更新 UI
            document.querySelectorAll('#tools .tool-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });

            // 显示工具信息
            document.getElementById('tool-header').style.display = 'block';
            document.getElementById('tool-name').textContent = currentTool.name;
            document.getElementById('tool-desc').textContent = currentTool.description || '无描述';

            // 生成参数表单
            const paramsPanel = document.getElementById('params-panel');
            const paramsBody = document.getElementById('params-body');
            paramsPanel.style.display = 'flex';

            const schema = currentTool.inputSchema;
            const properties = schema?.properties || {};
            const required = schema?.required || [];

            if (Object.keys(properties).length === 0) {
                paramsBody.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:24px;">此工具不需要参数</div>';
            } else {
                paramsBody.innerHTML = '';
                for (const [name, prop] of Object.entries(properties)) {
                    const isRequired = required.includes(name);
                    const group = document.createElement('div');
                    group.className = 'param-group';

                    let inputHTML = '';
                    if (prop.enum) {
                        inputHTML = `<select class="param-input" id="param-${name}" ${isRequired ? 'required' : ''}>
                            <option value="">-- 请选择 --</option>
                            ${prop.enum.map(v => `<option value="${v}">${v}</option>`).join('')}
                        </select>`;
                    } else if (prop.type === 'boolean') {
                        inputHTML = `<select class="param-input" id="param-${name}">
                            <option value="">-- 请选择 --</option>
                            <option value="true">true</option>
                            <option value="false">false</option>
                        </select>`;
                    } else if (prop.type === 'integer' || prop.type === 'number') {
                        inputHTML = `<input class="param-input" type="number" id="param-${name}" placeholder="输入${prop.type === 'integer' ? '整数' : '数字'}" ${isRequired ? 'required' : ''}>`;
                    } else {
                        inputHTML = `<input class="param-input" type="text" id="param-${name}" placeholder="${prop.default ? '默认: ' + prop.default : '请输入'}" ${isRequired ? 'required' : ''}>`;
                    }

                    group.innerHTML = `
                        <div class="param-label">
                            <span class="name">${name}</span>
                            <span class="type">${prop.type || 'string'}${prop.enum ? ' enum' : ''}</span>
                            ${isRequired ? '<span class="required">*</span>' : ''}
                        </div>
                        ${prop.description ? `<div class="param-desc">${prop.description}</div>` : ''}
                        ${inputHTML}
                    `;
                    paramsBody.appendChild(group);
                }
            }
        }

        async function sendRequest() {
            if (!currentService || !currentTool) {
                alert('请先选择服务和工具');
                return;
            }

            // 收集参数
            const schema = currentTool.inputSchema;
            const properties = schema?.properties || {};
            const params = {};

            for (const name of Object.keys(properties)) {
                const el = document.getElementById(`param-${name}`);
                if (el && el.value !== '') {
                    const prop = properties[name];
                    if (prop.type === 'integer') {
                        params[name] = parseInt(el.value, 10);
                    } else if (prop.type === 'number') {
                        params[name] = parseFloat(el.value);
                    } else if (prop.type === 'boolean') {
                        params[name] = el.value === 'true';
                    } else {
                        params[name] = el.value;
                    }
                }
            }

            const responseBody = document.getElementById('response-body');
            const responseStatus = document.getElementById('response-status');
            const sendBtn = document.getElementById('send-btn');

            sendBtn.disabled = true;
            sendBtn.textContent = '请求中...';
            responseBody.innerHTML = '<span class="loading">正在请求</span>';
            responseStatus.style.display = 'none';

            try {
                const resp = await fetch(currentService.path, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'tools/call',
                        params: { name: currentTool.name, arguments: params }
                    })
                });
                const data = await resp.json();

                responseStatus.style.display = 'inline-block';

                if (data.error) {
                    responseStatus.className = 'status error';
                    responseStatus.textContent = '错误';
                    responseBody.textContent = JSON.stringify(data.error, null, 2);
                } else {
                    responseStatus.className = 'status success';
                    responseStatus.textContent = '成功';

                    if (data.result?.content?.[0]?.text) {
                        responseBody.textContent = data.result.content[0].text;
                    } else {
                        responseBody.textContent = JSON.stringify(data.result, null, 2);
                    }
                }
            } catch (e) {
                responseStatus.style.display = 'inline-block';
                responseStatus.className = 'status error';
                responseStatus.textContent = '错误';
                responseBody.textContent = '请求失败: ' + e.message;
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = '▶ 发送请求';
            }
        }
    </script>
</body>

</html>
