# MCP Hub 配置文件
# 所有设置均可在此统一管理
#
# 使用方式:
#   ./mcp-hub -config config.yaml
#
# 优先级: 命令行参数 > 配置文件 > 环境变量 > 默认值

# 服务监听地址
addr: ":8080"

# API Key 认证（留空则不启用认证）
api_keys:
  # - "your-secret-key"

# 禁用请求日志
no_log: false

# ─── Prometheus 观测 ──────────────────────────────────────────────
# 启用后会在主端口 /metrics 路径暴露指标，供 Prometheus 抓取
# 认证方式：空=无认证，token=Bearer Token，basic_user+basic_pass=Basic Auth
# prometheus:
#   enabled: true
#   # token: "your-prometheus-token"       # Bearer Token（推荐，优先级高）
#   # basic_user: "prometheus"             # Basic Auth 用户名
#   # basic_pass: "secret"                 # Basic Auth 密码

# 外部 MCP 服务（通过 stdio 代理接入）
services:
  # ─── 内置服务：工作日计算 ────────────────────────────────────
  # 查询中国节假日和工作日信息
  - name: "工作日服务"
    description: "中国节假日和工作日计算"
    command: "./bin/workday-svc"
    path: "/mcp/workday"
    sandbox:
      network:
        enabled: true
      env:
        inherit: false
        allow: ["PATH", "HOME"]

  # ─── 内置服务：Arch Linux 包搜索 ─────────────────────────────
  # 搜索 Arch Linux 官方仓库和 AUR 软件包
  - name: "Arch Linux 搜索"
    description: "Arch Linux 官方仓库和 AUR 软件包搜索"
    command: "./bin/archlinux-svc"
    path: "/mcp/archlinux"
    sandbox:
      network:
        enabled: true
      env:
        inherit: false
        allow: ["PATH", "HOME"]

  # ─── 内置服务：代码执行沙箱 ──────────────────────────────────
  # Docker 容器隔离的代码执行，支持 Python / Node.js / Shell
  # 前置条件:
  #   1. Docker 已安装并运行
  #   2. 容器部署时需挂载 Docker socket（见 docker-compose.yml）
  # 镜像自动管理: 首次执行时若镜像不存在，会自动 pull 或从本地
  #   services/code-exec/sandboxes/<lang>/Dockerfile 构建，无需手动操作
  #
  # 网络说明: 下方 sandbox.network.enabled 控制「沙箱容器内代码」是否能联网
  #   - true: 沙箱容器使用 bridge 网络（可访问外网）
  #   - false/未配置: 沙箱容器无网络（默认，更安全）
  # 注意: 这里配置的是沙箱容器网络，不是 code-exec-svc 进程本身的网络
  #
  # 可选环境变量（覆盖默认配置，优先级高于 sandbox.network）:
  #   CODE_EXEC_PYTHON_IMAGE / CODE_EXEC_NODEJS_IMAGE / CODE_EXEC_SHELL_IMAGE
  #   CODE_EXEC_PYTHON_MEMORY / CODE_EXEC_NODEJS_MEMORY / CODE_EXEC_SHELL_MEMORY
  #   CODE_EXEC_PYTHON_NETWORK (none 或 bridge) 等
  - name: "代码执行沙箱"
    description: "Docker 容器隔离的代码执行，支持 Python/Node.js/Shell，自动捕获图表"
    command: "./bin/code-exec-svc"
    path: "/mcp/code-exec"
    sandbox:
      network:
        enabled: true
      timeout: "120s"
      env:
        inherit: false
        allow: ["PATH", "HOME", "DOCKER_HOST"]

